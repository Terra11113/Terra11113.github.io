<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef3fb"/>
      <stop offset="0.55" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eaf1f8"/>
    </linearGradient>
    <linearGradient id="bluePanel" x1="0" x2="1">
      <stop offset="0" stop-color="#e7f0fb"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="goldPanel" x1="0" x2="1">
      <stop offset="0" stop-color="#fff2d6"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <linearGradient id="greenPanel" x1="0" x2="1">
      <stop offset="0" stop-color="#e8f6f0"/>
      <stop offset="1" stop-color="#f7fffb"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#66809d" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b88919"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 44px; font-weight: 700; fill: #20385f; letter-spacing: 1px; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #52677f; }
      .panelTitle { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 700; fill: #1f3d66; }
      .panelSub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #5b6e86; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #253f63; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #5f7188; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #244466; }
      .chip { fill: #ffffff; stroke: #c7d6e8; stroke-width: 1.4; }
      .panel { stroke-width: 1.5; filter: url(#softShadow); }
      .goldStroke { stroke: #b88919; stroke-width: 5; fill: none; }
      .blueStroke { stroke: #467aaa; stroke-width: 3; fill: none; }
      .node { fill: #ffffff; stroke: #d8a63a; stroke-width: 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- subtle technical background -->
  <g opacity="0.22">
    <path d="M60 742 C240 610, 330 620, 520 720 S920 790, 1110 650 S1370 500, 1520 620" fill="none" stroke="#8da9c4" stroke-width="2"/>
    <path d="M110 150 C300 90, 460 100, 640 160 S980 280, 1160 170 S1410 80, 1530 170" fill="none" stroke="#a7b9ce" stroke-width="2"/>
    <g fill="#7c98b7">
      <circle cx="132" cy="260" r="3"/><circle cx="174" cy="260" r="3"/><circle cx="216" cy="260" r="3"/>
      <circle cx="132" cy="302" r="3"/><circle cx="174" cy="302" r="3"/><circle cx="216" cy="302" r="3"/>
      <circle cx="1380" cy="230" r="3"/><circle cx="1424" cy="260" r="3"/><circle cx="1470" cy="235" r="3"/>
      <circle cx="1388" cy="302" r="3"/><circle cx="1432" cy="330" r="3"/><circle cx="1480" cy="305" r="3"/>
    </g>
  </g>

  <text x="800" y="70" text-anchor="middle" class="title">Closed-loop Automatic Alignment of Freeform USTP Systems</text>
  <text x="800" y="105" text-anchor="middle" class="subtitle">Physics-informed simulation, adaptive image-quality objectives, and experimental feedback for optical alignment</text>

  <!-- central loop -->
  <circle cx="800" cy="475" r="235" fill="#ffffff" opacity="0.72" stroke="#d8e3f0" stroke-width="3"/>
  <circle cx="800" cy="475" r="278" class="goldStroke" opacity="0.82"/>
  <circle cx="800" cy="475" r="310" class="goldStroke" opacity="0.35"/>
  <path d="M1080 475 A280 280 0 0 1 660 718" class="goldStroke" marker-end="url(#arrow)"/>
  <path d="M520 475 A280 280 0 0 1 940 232" class="goldStroke" marker-end="url(#arrow)"/>

  <g>
    <circle cx="800" cy="475" r="116" fill="#f8fbff" stroke="#d7e2ef" stroke-width="2"/>
    <text x="800" y="432" text-anchor="middle" class="panelTitle">USTP Alignment</text>
    <text x="800" y="466" text-anchor="middle" class="small">Image-quality-driven</text>
    <text x="800" y="493" text-anchor="middle" class="small">closed-loop optimization</text>
    <line x1="720" y1="525" x2="880" y2="525" stroke="#d8a63a" stroke-width="4"/>
    <circle cx="800" cy="525" r="7" fill="#d8a63a"/>
  </g>

  <!-- Panel 1 -->
  <g>
    <rect x="70" y="170" width="435" height="250" rx="22" fill="url(#bluePanel)" stroke="#b8cce4" class="panel"/>
    <text x="105" y="220" class="panelTitle">1. Physical Simulation Law Extraction</text>
    <text x="105" y="250" class="panelSub">Extract pose-to-image-quality response from optical simulation</text>
    <g transform="translate(102 282)">
      <rect x="0" y="0" width="138" height="82" rx="12" class="chip"/>
      <path d="M18 54 L70 22 L118 54" fill="none" stroke="#517aa8" stroke-width="4"/>
      <path d="M70 22 L70 64" stroke="#517aa8" stroke-width="4"/>
      <text x="69" y="104" text-anchor="middle" class="tiny">Zemax USTP model</text>
    </g>
    <g transform="translate(272 282)">
      <rect x="0" y="0" width="155" height="82" rx="12" class="chip"/>
      <path d="M18 22 C58 12, 93 72, 135 58" fill="none" stroke="#d49a22" stroke-width="4"/>
      <path d="M28 58 C62 30, 98 38, 130 18" fill="none" stroke="#517aa8" stroke-width="3"/>
      <text x="78" y="104" text-anchor="middle" class="tiny">6-DOF perturbation scans</text>
    </g>
    <text x="105" y="386" class="small">Output: sensitivity relationship between</text>
    <text x="105" y="412" class="small">pose errors, distortion, and MTF degradation</text>
  </g>

  <!-- Panel 2 -->
  <g>
    <rect x="585" y="650" width="430" height="190" rx="22" fill="url(#goldPanel)" stroke="#e6c983" class="panel"/>
    <text x="620" y="700" class="panelTitle">2. Weighted Parameters &amp; Evaluation Function</text>
    <text x="620" y="730" class="panelSub">Design adaptive objectives for multi-stage alignment</text>
    <g transform="translate(632 755)">
      <rect x="0" y="0" width="95" height="52" rx="10" class="chip"/>
      <text x="48" y="33" text-anchor="middle" class="label">D<tspan baseline-shift="sub" font-size="11">f</tspan></text>
      <rect x="112" y="0" width="95" height="52" rx="10" class="chip"/>
      <text x="160" y="33" text-anchor="middle" class="label">D<tspan baseline-shift="sub" font-size="11">l</tspan></text>
      <rect x="224" y="0" width="95" height="52" rx="10" class="chip"/>
      <text x="272" y="33" text-anchor="middle" class="label">D<tspan baseline-shift="sub" font-size="11">k</tspan></text>
      <rect x="336" y="0" width="95" height="52" rx="10" class="chip"/>
      <text x="384" y="33" text-anchor="middle" class="label">MTF</text>
    </g>
    <path d="M610 808 C705 840, 900 840, 995 808" fill="none" stroke="#d8a63a" stroke-width="4" marker-end="url(#arrow)"/>
  </g>

  <!-- Panel 3 -->
  <g>
    <rect x="1095" y="170" width="435" height="365" rx="22" fill="url(#greenPanel)" stroke="#b8d9cd" class="panel"/>
    <text x="1130" y="220" class="panelTitle">3. Practical Closed-loop Alignment</text>
    <text x="1130" y="250" class="panelSub">Evaluate captured images, optimize weights, and actuate platform</text>
    <g transform="translate(1130 285)">
      <rect x="0" y="0" width="350" height="54" rx="12" class="chip"/>
      <text x="175" y="34" text-anchor="middle" class="small">Image acquisition</text>
      <rect x="0" y="76" width="350" height="54" rx="12" class="chip"/>
      <text x="175" y="110" text-anchor="middle" class="small">Metric evaluation &amp; dynamic weighting</text>
      <rect x="0" y="152" width="350" height="54" rx="12" class="chip"/>
      <text x="175" y="186" text-anchor="middle" class="small">Multi-objective optimizer</text>
      <rect x="0" y="228" width="350" height="54" rx="12" class="chip"/>
      <text x="175" y="262" text-anchor="middle" class="small">6-DOF motion platform actuation</text>
      <path d="M175 54 L175 76 M175 130 L175 152 M175 206 L175 228" stroke="#d8a63a" stroke-width="4" marker-end="url(#arrow)"/>
    </g>
  </g>

  <!-- simple optical platform illustration -->
  <g transform="translate(570 300)">
    <rect x="25" y="110" width="410" height="128" rx="22" fill="#edf4fb" stroke="#c9d7e7" stroke-width="2"/>
    <rect x="62" y="145" width="82" height="58" rx="8" fill="#ffffff" stroke="#467aaa" stroke-width="3"/>
    <path d="M144 174 L238 130 L340 174 L430 132" class="blueStroke"/>
    <ellipse cx="238" cy="130" rx="34" ry="17" fill="#fff8e6" stroke="#d8a63a" stroke-width="3"/>
    <rect x="318" y="144" width="70" height="62" rx="8" fill="#ffffff" stroke="#467aaa" stroke-width="3"/>
    <path d="M348 155 L372 195 M372 155 L348 195" stroke="#467aaa" stroke-width="3"/>
    <text x="230" y="275" text-anchor="middle" class="tiny">Freeform mirror pose error -> captured image metrics -> platform correction</text>
  </g>

  <!-- connection nodes -->
  <circle cx="524" cy="475" r="16" class="node"/>
  <circle cx="800" cy="754" r="16" class="node"/>
  <circle cx="1076" cy="475" r="16" class="node"/>
</svg>
